  <rect x="46" y="377" width="4" height="4" fill="#565f89" opacity="0.6"/>
  <rect x="38" y="377" width="4" height="4" fill="#565f89" opacity="0.6"/>
  <rect x="30" y="377" width="4" height="4" fill="#565f89" opacity="0.6"/>
  <rect x="22" y="377" width="4" height="4" fill="#565f89" opacity="0.5"/>
  <!-- Rows extending UP -->
  <rect x="46" y="369" width="4" height="4" fill="#565f89" opacity="0.55"/>
  <rect x="38" y="369" width="4" height="4" fill="#565f89" opacity="0.5"/>
  <rect x="30" y="369" width="4" height="4" fill="#565f89" opacity="0.45"/>
  <rect x="22" y="369" width="4" height="4" fill="#565f89" opacity="0.35"/>

  <rect x="46" y="361" width="4" height="4" fill="#565f89" opacity="0.5"/>
  <rect x="38" y="361" width="4" height="4" fill="#565f89" opacity="0.45"/>
  <rect x="30" y="361" width="4" height="4" fill="#565f89" opacity="0.35"/>

  <rect x="46" y="353" width="4" height="4" fill="#565f89" opacity="0.4"/>
  <rect x="38" y="353" width="4" height="4" fill="#565f89" opacity="0.3"/>

  <rect x="46" y="345" width="4" height="4" fill="#565f89" opacity="0.3"/>

  <!-- Dither dots in gaps -->
  <rect x="42" y="373" width="2" height="2" fill="#565f89" opacity="0.3"/>
  <rect x="34" y="373" width="2" height="2" fill="#565f89" opacity="0.25"/>
  <rect x="26" y="373" width="2" height="2" fill="#565f89" opacity="0.2"/>
  <rect x="42" y="365" width="2" height="2" fill="#565f89" opacity="0.25"/>
  <rect x="34" y="365" width="2" height="2" fill="#565f89" opacity="0.2"/>
  <rect x="42" y="357" width="2" height="2" fill="#565f89" opacity="0.2"/>

  <text x="68" y="82" fill="#565f89" font-size="11">metadata.yaml</text>

