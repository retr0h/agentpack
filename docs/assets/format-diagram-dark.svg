<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="13">
  <rect width="820" height="440" fill="#1a1b26"/>

  <!-- Title — bumped to 13px to match body -->
  <text x="55" y="40" fill="#c678dd" font-size="13">.agentpack content types</text>
  <text x="418" y="40" fill="#7982a9" font-size="13">Supported agents</text>

  <!-- Archive box -->
  <rect x="50" y="55" width="200" height="320" fill="none" stroke="#c678dd" stroke-width="3" opacity="0.4"/>

  <!-- Top-right corner: extends RIGHT and DOWN from corner
       Widest row at top, tapers down — point at bottom-right -->
  <!-- Col 0 (at box edge x=246) -->
  <rect x="246" y="51" width="4" height="4" fill="#c678dd" opacity="0.6"/>
  <rect x="246" y="59" width="4" height="4" fill="#c678dd" opacity="0.6"/>
  <rect x="246" y="67" width="4" height="4" fill="#c678dd" opacity="0.6"/>
  <rect x="246" y="75" width="4" height="4" fill="#c678dd" opacity="0.5"/>
  <!-- Col 1 -->
  <rect x="254" y="51" width="4" height="4" fill="#c678dd" opacity="0.55"/>
  <rect x="254" y="59" width="4" height="4" fill="#c678dd" opacity="0.5"/>
  <rect x="254" y="67" width="4" height="4" fill="#c678dd" opacity="0.45"/>
  <!-- Col 2 -->
  <rect x="262" y="51" width="4" height="4" fill="#c678dd" opacity="0.5"/>
  <rect x="262" y="59" width="4" height="4" fill="#c678dd" opacity="0.45"/>
  <!-- Col 3 -->
  <rect x="270" y="51" width="4" height="4" fill="#c678dd" opacity="0.4"/>
  <!-- Dither dots -->
  <rect x="250" y="55" width="2" height="2" fill="#c678dd" opacity="0.3"/>
  <rect x="250" y="63" width="2" height="2" fill="#c678dd" opacity="0.25"/>
  <rect x="250" y="71" width="2" height="2" fill="#c678dd" opacity="0.2"/>
  <rect x="258" y="55" width="2" height="2" fill="#c678dd" opacity="0.25"/>
  <rect x="258" y="63" width="2" height="2" fill="#c678dd" opacity="0.2"/>
  <rect x="266" y="55" width="2" height="2" fill="#c678dd" opacity="0.2"/>

  <!-- Bottom-left corner: extends LEFT and DOWN from corner
       Exact mirror of top-right: widest row at top (box edge), tapers down
       Point at bottom-left -->
  <!-- Row 0 — straddles box bottom like top-right straddles box top -->
  <rect x="46" y="351" width="4" height="4" fill="#7982a9" opacity="0.6"/>
  <rect x="38" y="351" width="4" height="4" fill="#7982a9" opacity="0.6"/>
  <rect x="30" y="351" width="4" height="4" fill="#7982a9" opacity="0.6"/>
  <rect x="22" y="351" width="4" height="4" fill="#7982a9" opacity="0.5"/>
  <!-- Row 1 — 3 blocks -->
  <rect x="46" y="359" width="4" height="4" fill="#7982a9" opacity="0.55"/>
  <rect x="38" y="359" width="4" height="4" fill="#7982a9" opacity="0.5"/>
  <rect x="30" y="359" width="4" height="4" fill="#7982a9" opacity="0.45"/>
  <!-- Row 2 — 2 blocks -->
  <rect x="46" y="367" width="4" height="4" fill="#7982a9" opacity="0.5"/>
  <rect x="38" y="367" width="4" height="4" fill="#7982a9" opacity="0.45"/>
  <!-- Row 3 — 1 block (the point) -->
  <rect x="46" y="375" width="4" height="4" fill="#7982a9" opacity="0.4"/>
  <!-- Dither dots -->
  <rect x="42" y="355" width="2" height="2" fill="#7982a9" opacity="0.3"/>
  <rect x="34" y="355" width="2" height="2" fill="#7982a9" opacity="0.25"/>
  <rect x="26" y="355" width="2" height="2" fill="#7982a9" opacity="0.2"/>
  <rect x="42" y="363" width="2" height="2" fill="#7982a9" opacity="0.25"/>
  <rect x="34" y="363" width="2" height="2" fill="#7982a9" opacity="0.2"/>
  <rect x="42" y="371" width="2" height="2" fill="#7982a9" opacity="0.2"/>

  <text x="68" y="82" fill="#7982a9" font-size="11">metadata.yaml</text>

  <!-- SKILL — green -->
  <text x="68" y="118" fill="#50fa7b" font-weight="bold" font-size="14">skill</text>
  <line x1="250" y1="114" x2="400" y2="114" stroke="#50fa7b" stroke-width="2"/>
  <rect x="400" y="110" width="4" height="8" fill="#50fa7b"/>
  <rect x="404" y="112" width="4" height="4" fill="#50fa7b"/>
  <text x="418" y="118" fill="#50fa7b" font-weight="bold">All 50+ agents</text>

  <!-- COMMAND — cyan -->
  <text x="68" y="163" fill="#00d4ff" font-weight="bold" font-size="14">command</text>
  <line x1="250" y1="159" x2="400" y2="159" stroke="#00d4ff" stroke-width="2"/>
  <rect x="400" y="155" width="4" height="8" fill="#00d4ff"/>
  <rect x="404" y="157" width="4" height="4" fill="#00d4ff"/>
  <text x="418" y="163" fill="#00d4ff" font-weight="bold">Claude Code</text>

  <!-- AGENT — magenta -->
  <text x="68" y="208" fill="#c678dd" font-weight="bold" font-size="14">agent</text>
  <line x1="250" y1="204" x2="400" y2="204" stroke="#c678dd" stroke-width="2"/>
  <rect x="400" y="200" width="4" height="8" fill="#c678dd"/>
  <rect x="404" y="202" width="4" height="4" fill="#c678dd"/>
  <text x="418" y="208" fill="#c678dd" font-weight="bold">Claude Code</text>

  <!-- MCP — orange -->
  <text x="68" y="253" fill="#ffb86c" font-weight="bold" font-size="14">mcp</text>
  <line x1="250" y1="249" x2="400" y2="249" stroke="#ffb86c" stroke-width="2"/>
  <rect x="400" y="245" width="4" height="8" fill="#ffb86c"/>
  <rect x="404" y="247" width="4" height="4" fill="#ffb86c"/>
  <text x="418" y="253" fill="#ffb86c" font-weight="bold">9 agents</text>
  <text x="418" y="271" fill="#7982a9" font-size="11">Claude Code, Cursor, Copilot, Windsurf, Cline, + 4</text>

  <!-- HOOK — pink -->
  <text x="68" y="313" fill="#ff6ec7" font-weight="bold" font-size="14">hook</text>
  <line x1="250" y1="309" x2="400" y2="309" stroke="#ff6ec7" stroke-width="2"/>
  <rect x="400" y="305" width="4" height="8" fill="#ff6ec7"/>
  <rect x="404" y="307" width="4" height="4" fill="#ff6ec7"/>
  <text x="418" y="313" fill="#ff6ec7" font-weight="bold">5 agents</text>
  <text x="418" y="331" fill="#7982a9" font-size="11">Claude Code, Codex, Windsurf, Cline, Devin</text>

  <!-- CONFIG — blue -->
  <text x="68" y="358" fill="#7aa2f7" font-weight="bold" font-size="14">config</text>
  <line x1="250" y1="354" x2="400" y2="354" stroke="#7aa2f7" stroke-width="2"/>
  <rect x="400" y="350" width="4" height="8" fill="#7aa2f7"/>
  <rect x="404" y="352" width="4" height="4" fill="#7aa2f7"/>
  <text x="418" y="358" fill="#7aa2f7" font-weight="bold">Claude Code</text>
</svg>
