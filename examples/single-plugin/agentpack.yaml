name: acme-toolkit
version: 1.0.0
description: "ACME Corp security toolkit for Claude Code"

author:
  name: "ACME Corp"
  email: "security@acme.example.com"

license: MIT
homepage: "https://github.com/acme/toolkit"
keywords: [security, scanning, review]
category: security

skills:
  - skills/*.md

commands:
  - commands/*.md

hooks:
  - hooks/hooks.json
  - hooks/*.sh

agents:
  - agents/*.md

mcp:
  - type: remote
    name: acme-cloud
    url: "https://mcp.acme.example.com/v1"

  - type: ux
    name: acme-ui
    package: "@acme/mcp-ui"
    args: ["--verbose"]

settings:
  - settings/settings.json
